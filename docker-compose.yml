name: reverse-proxy

services:
  reverse-proxy:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: node index.js
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - proxy-net

networks:
  proxy-net:
    driver: bridge